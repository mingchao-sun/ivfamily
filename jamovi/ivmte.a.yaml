---
name: ivmte
title: 'Marginal Treatment Effects'
jas: '1.2'
version: '1.0.0'
menuGroup: IV
menuSubgroup: Estimation
menuTitle: 'Marginal Treatment Effects'
menuSubtitle: 'Heckman and Vytlacil: effects by resistance to treatment, ATE, ATT, ATUT'

options:
    - name: data
      type: Data

    - name: outcome
      title: 'Outcome'
      type: Variable
      permitted:
          - numeric

    - name: treat
      title: 'Binary treatment (0/1)'
      type: Variable
      suggested:
          - nominal
          - continuous
      permitted:
          - numeric
          - factor
          - id

    - name: instruments
      title: 'Instruments (excluded from the outcome)'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: covs
      title: 'Covariates (optional)'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: cluster
      title: 'Cluster (optional)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: degree
      title: 'Degree of the polynomial in the marginal treatment effect'
      type: Integer
      default: 2
      min: 1
      max: 4

    - name: link
      title: 'First stage (propensity score)'
      type: List
      options:
          - name: probit
            title: 'Probit'
          - name: logit
            title: 'Logit'
      default: probit

    - name: nboot
      title: 'Bootstrap samples'
      type: Integer
      default: 300
      min: 50
      max: 5000

    - name: level
      title: 'Confidence level (%)'
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: seed
      title: 'Random seed'
      type: Integer
      default: 1234
      min: 1
      max: 999999

    - name: plot
      title: 'Marginal treatment effect plot'
      type: Bool
      default: true

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
