---
name: ivmte
title: 'Marginal Treatment Effects'
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: support
      title: 'Propensity score and common support'
      type: Table
      rows: 0
      clearWith: [outcome, treat, instruments, covs, cluster, degree, link, nboot, level, seed]
      columns:
        - name: group
          title: ''
          type: text
        - name: n
          title: 'N'
          type: integer
        - name: mean
          title: 'Mean'
          type: number
        - name: min
          title: 'Lowest'
          type: number
        - name: max
          title: 'Highest'
          type: number

    - name: pars
      title: 'Treatment effect parameters'
      type: Table
      rows: 0
      clearWith: [outcome, treat, instruments, covs, cluster, degree, link, nboot, level, seed]
      columns:
        - name: what
          title: ''
          type: text
        - name: est
          title: 'Estimate'
          type: number
        - name: se
          title: 'Std. error'
          type: number
        - name: lo
          title: 'CI lower'
          type: number
        - name: hi
          title: 'CI upper'
          type: number
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue

    - name: tests
      title: 'Tests of heterogeneity'
      type: Table
      rows: 0
      clearWith: [outcome, treat, instruments, covs, cluster, degree, link, nboot, level, seed]
      columns:
        - name: what
          title: ''
          type: text
        - name: chisq
          title: 'Chi-square'
          type: number
        - name: df
          title: 'df'
          type: integer
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue

    - name: curve
      title: 'Marginal treatment effect by resistance to treatment'
      type: Table
      rows: 0
      clearWith: [outcome, treat, instruments, covs, cluster, degree, link, nboot, level, seed]
      columns:
        - name: u
          title: 'Resistance u'
          type: number
        - name: mte
          title: 'MTE'
          type: number
        - name: se
          title: 'Std. error'
          type: number
        - name: lo
          title: 'CI lower'
          type: number
        - name: hi
          title: 'CI upper'
          type: number

    - name: mtePlot
      title: 'Marginal treatment effect'
      type: Image
      width: 560
      height: 380
      renderFun: .plotMte
      visible: (plot)
      clearWith: [outcome, treat, instruments, covs, cluster, degree, link, nboot, level, seed]

    - name: psPlot
      title: 'Propensity score by treatment'
      type: Image
      width: 560
      height: 340
      renderFun: .plotPs
      visible: (plot)
      clearWith: [outcome, treat, instruments, covs, cluster, degree, link, nboot, level, seed]

refs:
    - heckmanvytlacil2005
    - andresen2018
...
