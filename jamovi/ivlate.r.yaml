      visible: true
      clearWith:
          - outcome
          - treatment
          - instrument
          - controls
          - cluster
          - vce
          - small
          - level
      columns:
          - name: item
            title: ''
            type: text
          - name: estimate
            title: Estimate
            type: number
          - name: se
            title: Std. error
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: lo
            title: CI lower
            type: number
          - name: hi
            title: CI upper
            type: number

    - name: shares
      title: Compliance groups
      type: Table
      visible: true
      clearWith:
          - outcome
          - treatment
          - instrument
          - controls
          - cluster
      columns:
          - name: group
            title: Group
            type: text
          - name: share
            title: Share of the population
            type: number
            format: pc
          - name: se
            title: Std. error
            type: number

    - name: profile
      title: Covariate means by compliance group
      type: Table
