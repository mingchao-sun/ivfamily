          - outcome
          - treatment
          - instrument
          - controls
          - cluster
          - profile
      columns:
          - name: variable
            title: Covariate
            type: text
          - name: all
            title: All
            type: number
          - name: always
            title: Always-takers
            type: number
          - name: never
            title: Never-takers
            type: number
          - name: compliers
            title: Compliers
            type: number
          - name: ratio
            title: Compliers / all
            type: number
