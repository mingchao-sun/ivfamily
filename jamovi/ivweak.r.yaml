---
name: ivweak
title: Weak-Instrument-Robust Inference
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: tests
      title: 'Tests of the hypothesised coefficient'
      type: Table
      visible: true
      clearWith:
          - outcome
          - endog
          - instruments
          - controls
          - absorb
          - cluster
          - weights
          - vce
          - small
          - nullValue
      columns:
          - name: test
            title: 'Test'
            type: text
          - name: stat
            title: 'Statistic'
            type: number
          - name: df
            title: 'df'
            type: integer
          - name: p
            title: 'p'
            type: number
            format: zto,pvalue

    - name: csets
      title: 'Confidence sets'
      type: Table
      visible: true
      clearWith:
          - outcome
          - endog
          - instruments
          - controls
          - absorb
          - cluster
          - weights
          - vce
          - small
          - level
          - gridWidth
      columns:
          - name: test
            title: 'Method'
            type: text
          - name: set
            title: 'Set'
            type: text

    - name: pPlot
      title: P-values of the tests against the coefficient
      type: Image
      width: 640
      height: 420
      renderFun: .plotP
      visible: (plot)
      clearWith:
          - outcome
          - endog
          - instruments
          - controls
          - absorb
          - cluster
          - weights
          - vce
          - small
          - level
          - gridWidth

...
