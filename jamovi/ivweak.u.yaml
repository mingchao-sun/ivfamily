title: Weak-Instrument-Robust Inference
name: ivweak
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Endogenous regressors
            children:
                - type: VariablesListBox
                  name: endog
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Excluded instruments
            children:
                - type: VariablesListBox
                  name: instruments
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Exogenous controls
            children:
                - type: VariablesListBox
                  name: controls
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Absorbed fixed effects (max 2)
            children:
                - type: VariablesListBox
                  name: absorb
                  isTarget: true
                  height: small
                  maxItemCount: 2
          - type: TargetLayoutBox
            label: Cluster variables (max 2)
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  height: small
                  maxItemCount: 2
          - type: TargetLayoutBox
            label: Weights
            children:
                - type: VariablesListBox
                  name: weights
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: Tests
      collapsed: true
      children:
          - type: TextBox
            name: nullValue
            label: Hypothesised coefficient (H0)
            format: number
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
          - type: TextBox
            name: gridWidth
            label: Grid half-width (2SLS standard errors)
            format: number
    - type: CollapseBox
      label: Standard errors
      collapsed: true
      children:
          - type: ComboBox
            name: vce
          - type: CheckBox
            name: small
    - type: CollapseBox
      label: Tables
      collapsed: true
      children:
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
