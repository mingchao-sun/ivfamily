---
title: Instrumental Variables Family
name: ivfamily
version: 1.0.0
jms: '1.0'
authors:
  - Mingchao Sun
maintainer: Mingchao Sun <mingchao.sun@hotmail.com>
date: '2026-11-20'
type: R
description: >-
  Instrumental-variable regression: 2SLS, LIML, Fuller, k-class and two-step GMM
  with classical, robust and cluster-robust standard errors, absorbed fixed
  effects, first-stage and weak-instrument diagnostics and overidentification
  tests.
datasets:
  - name: Cigarette demand (Stock and Watson)
    path: cigarettes_sw.csv
    description: >-
      48 US states in 1995 (CigarettesSW, AER package). Outcome lq (log packs
      per capita), endogenous regressor lp (log real price), control li (log
      real income), instruments tdiff (real sales tax) and tax_r (real cigarette
      excise tax).
  - name: College distance and wages
    path: college_distance.csv
    description: >-
      4,739 high-school students (CollegeDistance, AER package). Outcome wage,
      endogenous regressor education, instruments distance and tuition, controls
      gender, ethnicity, unemp (set gender and ethnicity to Nominal).
  - name: Simulated two endogenous regressors
    path: sim_two_endogenous.csv
    description: >-
      Simulated, 2,000 rows and 100 clusters (g): outcome y, endogenous
      regressors x1 and x2, control w, instruments z1 to z4 (z3 is mildly
      invalid and, with z4, drives x2). Heteroskedastic errors. Use for First
      Stage and Weak Instruments and for Overidentification and Endogeneity.
  - name: Simulated weak instruments
    path: sim_weak.csv
    description: >-
      Simulated, 500 rows and 50 clusters (g): outcome y, one endogenous
      regressor x (true coefficient 0.5), control w, three weak instruments z1,
      z2, z3 (first-stage F about 5). Use for Weak-Instrument-Robust Inference.
  - name: Family size and labour supply (Angrist and Evans)
    path: fertility.csv
    description: >-
      254,654 mothers (Fertility, AER package): outcome weeks, binary treatment
      morekids, binary instrument samesex, covariates age, boy1, afam, hispanic,
      other. Use for Binary Instrument and LATE.
  - name: Simulated shift-share design
    path: sim_shiftshare.csv
    description: >-
      Simulated, 4,000 rows: 500 regions, 40 sectors, 8 sectors per region, in
      long form. Outcome y, endogenous regressor d (true coefficient 0.5),
      region, sector, share, shock, control x1, weights pop, region cluster
      state, sector cluster sector_group. Use for Shift-Share (Bartik) IV.
  - name: Simulated schooling choice (marginal treatment effects)
    path: sim_mte.csv
    description: >-
      Simulated, 6,000 people: logwage, college (yes or no), score, female and
      the instruments distance and tuition. Returns to college fall with the
      unobserved resistance to going: the marginal treatment effect is 0.45 +
      0.10 score - 0.30 times the normal quantile of u. Use for Marginal
      Treatment Effects.
