title: Shift-Share (Bartik) IV
name: shiftshare
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome (region level)
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Endogenous regressor (region level)
            children:
                - type: VariablesListBox
                  name: endog
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Region
            children:
                - type: VariablesListBox
                  name: region
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Sector (shock)
            children:
                - type: VariablesListBox
                  name: sector
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Exposure share (region by sector)
            children:
                - type: VariablesListBox
                  name: share
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Shock (sector level)
            children:
                - type: VariablesListBox
                  name: shock
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Controls (region level)
            children:
                - type: VariablesListBox
                  name: controls
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Weights (region level)
            children:
                - type: VariablesListBox
                  name: weights
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Region cluster (for example state)
            children:
                - type: VariablesListBox
                  name: regionCluster
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Sector cluster (for example industry group)
            children:
                - type: VariablesListBox
                  name: sectorCluster
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: Estimation
      collapsed: true
      children:
          - type: CheckBox
            name: sumShares
          - type: TextBox
            name: h0
            label: Value of the coefficient under the null
            format: number
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
          - type: CheckBox
            name: showStages
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
