<!doctype html>
<html><head><meta charset="utf-8"><title>ivfamily icon preview</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:20px;background:#fff;color:#222}
.row{display:flex;gap:24px;align-items:flex-end;margin-bottom:20px}
.cell{text-align:center;font-size:12px;color:#555}
.box{padding:10px;border:1px solid #ddd;display:inline-block;background:#f3f3f3}
.dark{background:#2b2b2b}
img{display:block}
</style></head><body>
<h3>IV family ribbon icon (74 x 44)</h3>
<div class="row">
  <div class="cell"><div class="box"><img src="../icon/analysis-iv.svg" width="74" height="44"></div>actual size</div>
  <div class="cell"><div class="box"><img src="../icon/analysis-iv.svg" width="148" height="88"></div>2x</div>
  <div class="cell"><div class="box"><img src="../icon/analysis-iv.svg" width="296" height="176"></div>4x</div>
  <div class="cell"><div class="box dark"><img src="../icon/analysis-iv.svg" width="148" height="88"></div>on dark</div>
</div>
<h3>Next to the other families</h3>
<div class="row">
  <div class="cell"><div class="box"><img src="../../rdfamily/icon/analysis-rdd.svg" width="74" height="44"></div>RDD</div>
  <div class="cell"><div class="box"><img src="../../scmfamily/icon/analysis-scm.svg" width="74" height="44"></div>SCM</div>
  <div class="cell"><div class="box"><img src="../../didfamily/icon/did.svg" width="74" height="44"></div>DiD</div>
  <div class="cell"><div class="box"><img src="../icon/analysis-iv.svg" width="74" height="44"></div>IV</div>
</div>
</body></html>
